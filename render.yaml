services:
  - type: web
    name: free-design-toolkit-assistant
    runtime: python
    plan: free
    buildCommand: python -m py_compile assistant_server.py
    startCommand: python assistant_server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: OPENROUTER_MODEL
        value: openrouter/auto
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        value: 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